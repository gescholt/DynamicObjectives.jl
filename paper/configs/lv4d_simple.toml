# LV-4D Simple — Non-identifiable Lotka-Volterra (Paper Example 4.3, negative result)
# 2-species, 4-param (a,b,c,d), 1 output (y=x1)
# NOT structurally identifiable — expects degenerate landscape (manifold of equivalent params)
# p_true = (0.2, 0.4, 0.7, 0.9), IC = (0.3, 0.6), t in [0, 1]
#
# Usage:
#   julia --project=. paper/run_experiment.jl paper/configs/lv4d_simple.toml

[experiment]
name = "lv4d_simple"
description = "LV-4D simple (non-identifiable) — Example 4.3 negative result"

[model]
catalogue_path = "../catalogue/lv4d_simple_catalogue.jsonl"
entry_name = "LV4D_simple_1"

[domain]
radius = 0.1

[polynomial]
GN = 12
degree_range = [4, 2, 8]
basis = "chebyshev"

[solver]
method = "Tsit5"
abstol = 1e-4
reltol = 1e-4

[refinement]
enabled = true
method = "NelderMead"
max_time = 60.0
gradient_method = "finitediff"
gradient_tolerance = 1e-4

[analysis]
enabled = true
gradient_method = "finitediff"
newton_tol = 1e-8
newton_max_iterations = 200
hessian_tol = 1e-6
dedup_fraction = 0.02

[output]
dir = "../../results/lv4d_simple"
