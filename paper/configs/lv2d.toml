# LV-2D — Lotka-Volterra 2D CP Recovery (Paper Example 4.1)
# 2-species LV, params (a,b), 1 output, globally identifiable
#
# Usage:
#   julia --project=. paper/run_experiment.jl paper/configs/lv2d.toml

[experiment]
name = "lv2d"
description = "Lotka-Volterra 2D — Example 4.1"

[model]
catalogue_path = "../catalogue/lv2d_catalogue.jsonl"
entry_name = "LV2D_1"
# sample_times = [0.0, 0.5, 1.0, 2.0, 5.0, 10.0]  # optional: explicit time sample points (overrides time_interval + numpoints)

[domain]
radius = 0.01

[polynomial]
GN = 12
degree_range = [4, 2, 10]
basis = "chebyshev"

[solver]
method = "AutoTsit5"
abstol = 1e-4
reltol = 1e-4

[refinement]
enabled = true
method = "NelderMead"
max_time = 60.0
gradient_method = "finitediff"
gradient_tolerance = 1e-4

[analysis]
enabled = true
gradient_method = "finitediff"
newton_tol = 1e-8
newton_max_iterations = 200
hessian_tol = 1e-6
dedup_fraction = 0.02

[output]
dir = "../../results/lv2d"
