# FHN-3D — FitzHugh-Nagumo 3D CP Recovery (Paper Example 4.4)
# 2-species FHN, params (a,b,c), 1 output
# Based on fhn3d_basic — recovery 6.7e-4 at deg 6, GN=15, r=0.01
#
# Usage:
#   julia --project=. paper/run_experiment.jl paper/configs/fhn3d.toml

[experiment]
name = "fhn3d"
description = "FitzHugh-Nagumo 3D — Example 4.4"

[model]
catalogue_path = "../catalogue/fhn3d_catalogue.jsonl"
entry_name = "FHN3D_1"

[domain]
radius = 0.01

[polynomial]
GN = 15
degree_range = [4, 2, 10]
basis = "chebyshev"

[solver]
method = "AutoTsit5"
abstol = 1e-4
reltol = 1e-4

[refinement]
enabled = true
method = "NelderMead"
max_time = 60.0
gradient_method = "finitediff"
gradient_tolerance = 1e-4

[analysis]
enabled = true
gradient_method = "finitediff"
newton_tol = 1e-8
newton_max_iterations = 200
hessian_tol = 1e-6
dedup_fraction = 0.02
f_accept_tol = 0.02

[output]
dir = "../../results/fhn3d"
