# LV-4D Eps-Constrained — Constrained Lotka-Volterra 4D CP Recovery (Paper Example 4.3)
# 4-species skew-symmetric LV, params (eps1-4), 4 outputs
# Based on lv4d_basic — star performer: recovery 8.5e-7 at deg 8, GN=12, r=0.005
#
# Usage:
#   julia --project=. paper/run_experiment.jl paper/configs/lv4d_eps.toml

[experiment]
name = "lv4d_eps"
description = "Constrained LV4D eps-parameterized — Example 4.3"

[model]
catalogue_path = "../catalogue/lv4d_catalogue.jsonl"
entry_name = "LV4D_1"

[domain]
radius = 0.005

[polynomial]
GN = 12
degree_range = [4, 2, 8]
basis = "chebyshev"

[solver]
method = "Tsit5"
abstol = 1e-4
reltol = 1e-4

[refinement]
enabled = true
method = "NelderMead"
max_time = 60.0
gradient_method = "finitediff"
gradient_tolerance = 1e-4

[analysis]
enabled = true
gradient_method = "finitediff"
newton_tol = 1e-8
newton_max_iterations = 200
hessian_tol = 1e-6
dedup_fraction = 0.02

[output]
dir = "../../results/lv4d_eps"
