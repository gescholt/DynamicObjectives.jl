# DAISY 4D Sweep — DAISY Ex3 4D at radius=0.005
# Mirrors one configuration from: DynamicObjectives/examples/run_daisy4d_sweep.jl
#
# For a full radius sweep, run multiple configs or use the sweep script directly.
#
# Usage:
#   using DynamicObjectives
#   result = run_experiment_from_config("DynamicObjectives/examples/configs/daisy4d_sweep.toml")

[experiment]
name = "daisy4d_r005"
description = "DAISY Ex3 4D at radius=0.005, degrees 4:2:8"

[model]
catalogue_path = "globtim_results/daisy4d_catalogue.jsonl"
entry_name = "DAISY_4D_1"

[domain]
radius = 0.005

[polynomial]
GN = 12
degree_range = [4, 2, 8]
basis = "chebyshev"

[solver]
method = "Tsit5"
abstol = 1e-4
reltol = 1e-4

[refinement]
enabled = true
method = "NelderMead"
max_time = 60.0
gradient_method = "finitediff"
gradient_tolerance = 1e-4

[analysis]
enabled = true
gradient_method = "finitediff"
newton_tol = 1e-8
newton_max_iterations = 200
hessian_tol = 1e-6
dedup_fraction = 0.02
# accept_tol = 1e-2       # gradient norm acceptance threshold (default: 1e-2)
# f_accept_tol = 0.01     # function value acceptance — accept CPs in flat valleys (default: disabled)

[output]
dir = "globtim_results/daisy4d_r005"
