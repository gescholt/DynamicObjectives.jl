[deps]
DataStructures = "864edb3b-99cc-5e75-8d2d-829cb0a9cfe8"
JSON3 = "0f8b85d8-7281-11e9-16c2-39a750bddbf1"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Logging = "56ddb016-857b-54e1-b83d-db4d58db5568"
ModelingToolkit = "961ee093-0014-501f-94e3-6117800e7a78"
OrdinaryDiffEqRosenbrock = "43230ef6-c299-4910-a778-202eb28ce4ce"
OrdinaryDiffEqSDIRK = "2d112036-d095-4a1e-ab9a-08536f3ecdbf"
OrdinaryDiffEqTsit5 = "b1df2697-797e-41e3-8120-5422d3b24e4a"
OrdinaryDiffEqVerner = "79d7bb75-1356-48c1-b8c0-6832512096c2"
PrettyTables = "08abe8d2-0d0c-5749-adfa-8a2ac140af0d"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
SciMLBase = "0bca4576-84f4-4d90-8ffe-ffa030f20462"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Term = "22787eb5-b846-44ae-b979-8e399b8463ab"
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"
UnicodePlots = "b8865327-cd53-5732-bb35-84acbb429228"

[weakdeps]
Globtim = "00da9514-6261-47e9-8848-33640cb1e528"
GlobtimPostProcessing = "b470b6bb-4443-493e-998d-c7c5e1aa9116"
Optim = "429524aa-4258-5aef-a3af-852621145aeb"

[extensions]
DynamicObjectivesGlobtimCoreExt = "Globtim"
DynamicObjectivesGlobtimExt = ["Globtim", "GlobtimPostProcessing", "Optim"]

[compat]
DataStructures = "0.18, 0.19"
Aqua = "0.8"
Globtim = "1, 2"
GlobtimPostProcessing = "0.1"
JSON3 = "1.14"
LinearAlgebra = "1"
Logging = "1"
# The SciML majors below are pinned together on purpose: MTK 11 / SciMLBase 3 /
# OrdinaryDiffEq* 2 only resolve as one wave, and the wave needs a source port
# this package has not had. Measured 2026-09-16 on a fresh resolve (MTK 11.26.8,
# SciMLBase 3.55.0, Symbolics 7.39.2, solvers 2.x): everything precompiles, then
# the suite errors twice. (1) `verbose = false` into SciMLBase.init is rejected —
# "Passing a `Bool` for `verbose` is no longer supported in OrdinaryDiffEq v7" —
# at error_metrics.jl:532/557, data_generation.jl:81, screening.jl:236. (2) with
# those dropped, `SciMLBase.setp` is undefined (error_metrics.jl:536); it now
# lives in SymbolicIndexingInterface. Widening without that port is a compat lie:
# the workspace stays on the old stack (Opt_Traj and BioObjectives pin
# SciMLBase 2) while a fresh mirror-CI resolve takes the new one and errors.
ModelingToolkit = "10"
Optim = "1, 2"
OrdinaryDiffEqRosenbrock = "1"
OrdinaryDiffEqSDIRK = "1"
OrdinaryDiffEqTsit5 = "1"
OrdinaryDiffEqVerner = "1"
# PrettyTables 3.x renamed the backend kwarg values (Symbol, not Val) — display.jl
# uses the 2.x Val API, so the CompatHelper "2, 3" widening was a compat lie
# (Pkg.test resolves 3.x fresh and errors while the workspace stays on 2.4).
PrettyTables = "2"
Printf = "1"
SciMLBase = "2"
StaticArrays = "1"
Statistics = "1"
Term = "2"
Test = "1"
TOML = "1"
UnicodePlots = "3"
julia = "1.12"

[extras]
Aqua = "4c88cf16-eb10-579e-8560-4a9242c79595"
Globtim = "00da9514-6261-47e9-8848-33640cb1e528"
Optim = "429524aa-4258-5aef-a3af-852621145aeb"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
# GlobtimPostProcessing (weakdep) is deliberately NOT in the test target: it is
# unregistered, so Pkg.test on the standalone mirror cannot resolve it. The
# DynamicObjectivesGlobtimExt entry point is covered by
# test/test_ext_toml_pipeline.jl, which runtests.jl includes only when
# GlobtimPostProcessing is resolvable (workspace profiles; skipped on the mirror).
test = ["Aqua", "Test", "Globtim", "Optim"]
